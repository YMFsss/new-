<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melody Tiles - Song Selection</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            touch-action: none; 
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            background: #2d2d2d;
        }
        canvas {
            display: block;
            background: #1e1e1e;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .interactive {
            pointer-events: auto !important;
        }
        .btn {
            padding: 12px 30px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
            border: none;
            font-size: 16px;
            width: 200px;
        }
        #pcBtn {
            background: #3278f0;
            box-shadow: 0 4px 15px rgba(50,120,240,0.4);
        }
        #mobileBtn {
            background: #e68c0a;
            box-shadow: 0 4px 15px rgba(230,140,10,0.4);
        }
        /* Difficulty State Buttons */
        .diff-btn { display: none; }
        #easyBtn { background: #28a745; box-shadow: 0 4px 15px rgba(40,167,69,0.4); }
        #normalBtn { background: #ffc107; color: #1a1a1a; box-shadow: 0 4px 15px rgba(255,193,7,0.4); }
        #hardBtn { background: #dc3545; box-shadow: 0 4px 15px rgba(220,53,69,0.4); }

        /* Song Selection Layout */
        .song-btn {
            display: none;
            background: #6f42c1;
            box-shadow: 0 4px 15px rgba(111,66,193,0.4);
        }
        .btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        #loadingText {
            font-size: 20px;
            color: #3278f0;
            font-weight: bold;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <script src="https://unpkg.com/aubiojs@0.1.3/build/aubio.min.js"></script>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="uiLayer">
            <button id="pcBtn" class="btn interactive">Play on PC (D F J K)</button>
            <button id="mobileBtn" class="btn interactive">Play on Mobile (Touch)</button>

            <button id="easyBtn" class="btn diff-btn interactive">Easy</button>
            <button id="normalBtn" class="btn diff-btn interactive">Normal</button>
            <button id="hardBtn" class="btn diff-btn interactive">Hard</button>

            <button class="btn song-btn interactive" data-filename="女神之翼.mp3">女神之翼</button>
            <button class="btn song-btn interactive" data-filename="完璧.mp3">完璧</button>
            <button class="btn song-btn interactive" data-filename="新紮特工.mp3">新紮特工</button>
            <button class="btn song-btn interactive" data-filename="日落時.mp3">日落時</button>

            <div id="loadingText">Downloading &<br>Analyzing song...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const pcBtn = document.getElementById("pcBtn");
        const mobileBtn = document.getElementById("mobileBtn");
        
        const easyBtn = document.getElementById("easyBtn");
        const normalBtn = document.getElementById("normalBtn");
        const hardBtn = document.getElementById("hardBtn");
        const diffButtons = [easyBtn, normalBtn, hardBtn];

        const songButtons = document.querySelectorAll(".song-btn");
        const loadingText = document.getElementById("loadingText");

        const TRACK_KEYS = ['d', 'f', 'j', 'k'];
        const COLUMN_WIDTH = 400 / 4;
        const TILE_HEIGHT = 100;
        const HIT_LINE_Y = 600 - 120;

        const DIFF_CONFIGS = {
            EASY:   { scrollDuration: 1.6, minNoteGap: 0.40, minInterval: 0.45 },
            NORMAL: { scrollDuration: 1.2, minNoteGap: 0.25, minInterval: 0.28 },
            HARD:   { scrollDuration: 0.8, minNoteGap: 0.14, minInterval: 0.16 }
        };

        let currentState = "MENU"; 
        let selectedDevice = null;
        let selectedDifficulty = "NORMAL";
        let scrollDuration = 1.2;          

        let activeTiles = [];
        let score = 0;
        let hp = 100;
        
        let feedbackText = "";
        let feedbackColor = "";
        let feedbackTimer = 0;
        
        let userAudio = null;
        let audioCtx = null;
        let songStartTime = 0;
        let aubio = null;

        function initAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === "suspended") audioCtx.resume();
        }

        pcBtn.onclick = () => {
            initAudioContext();
            selectedDevice = "PC";
            showDifficultySelection();
        };

        mobileBtn.onclick = () => {
            initAudioContext();
            selectedDevice = "MOBILE";
            showDifficultySelection();
        };

        function showDifficultySelection() {
            pcBtn.style.display = "none";
            mobileBtn.style.display = "none";
            diffButtons.forEach(btn => btn.style.display = "block");
        }

        easyBtn.onclick = () => selectDifficulty("EASY");
        normalBtn.onclick = () => selectDifficulty("NORMAL");
        hardBtn.onclick = () => selectDifficulty("HARD");

        function selectDifficulty(diff) {
            selectedDifficulty = diff;
            scrollDuration = DIFF_CONFIGS[diff].scrollDuration;
            
            diffButtons.forEach(btn => btn.style.display = "none");
            // Show song choice layout instead of file picker
            songButtons.forEach(btn => btn.style.display = "block");
        }

        // Attach listeners to preset song buttons
        songButtons.forEach(button => {
            button.addEventListener("click", async () => {
                const songFile = button.getAttribute("data-filename");
                hideSongSelection();
                loadingText.style.display = "block";
                currentState = "BUFFER";

                try {
                    // Fetch song audio over GitHub pages domain context
                    const response = await fetch(songFile);
                    if (!response.ok) throw new Error("Failed to load music asset.");
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                    if (typeof Aubio === "undefined") {
                        console.log("Aubio not loaded, auto use beat fallback");
                        activeTiles = detectOnsetFallback(audioBuffer);
                    } else {
                        try {
                            aubio = new Aubio();
                            activeTiles = await detectNotesAndGenerateTiles(audioBuffer);
                        } catch (pitchErr) {
                            console.warn("Pitch fail, fallback beat:", pitchErr);
                            activeTiles = detectOnsetFallback(audioBuffer);
                        }
                    }
                } catch (err) {
                    console.error("Audio processing failed completely. Falling back to clean defaults.", err);
                    activeTiles = []; 
                }

                if (userAudio) {
                    userAudio.pause();
                    userAudio.remove();
                }
                
                // Load file directly via URL routing for native playing HTML5 node
                userAudio = new Audio(songFile);
                loadingText.style.display = "none";
                setTimeout(startGame, 600);
            });
        });

        function hideSongSelection() {
            songButtons.forEach(btn => btn.style.display = "none");
        }

        async function detectNotesAndGenerateTiles(audioBuffer) {
            const sampleRate = audioBuffer.sampleRate;
            const channelData = audioBuffer.getChannelData(0);
            const bufferSize = 1024;
            const hopSize = 512;
            
            const notes = [];
            let lastNoteTime = 0;
            const minNoteGap = DIFF_CONFIGS[selectedDifficulty].minNoteGap;

            const pitchDetector = new aubio.Pitch("default", bufferSize, hopSize, sampleRate);
            pitchDetector.setUnit("hz");
            pitchDetector.setSilence(-40);
            pitchDetector.setThreshold(0.7);

            const maxIter = channelData.length - bufferSize;
            for (let i = 0; i <= maxIter; i += hopSize) {
                const chunk = channelData.slice(i, i + bufferSize);
                let pitch;
                try{pitch = pitchDetector.do(chunk);}catch{continue;}
                const currentTime = i / sampleRate;
                if (pitch > 60 && pitch < 1200 && currentTime - lastNoteTime > minNoteGap) {
                    const column = mapPitchToColumn(pitch);
                    notes.push({
                        spawnTime: currentTime - scrollDuration,
                        targetTime: currentTime,
                        col: column,
                        hit: false,
                        missed: false
                    });
                    lastNoteTime = currentTime;
                }
            }
            pitchDetector.destroy();
            return notes;
        }

        function detectOnsetFallback(audioBuffer){
            const channelData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const blockSize = 2048;
            const times = [];
            let lastPeakTime = 0;
            const minInterval = DIFF_CONFIGS[selectedDifficulty].minInterval;
            
            for (let i = 0; i < channelData.length; i += blockSize) {
                const block = channelData.slice(i, i + blockSize);
                let sum = 0;
                for (let j = 0; j < block.length; j++) sum += block[j] * block[j];
                const rms = Math.sqrt(sum / block.length);
                const currentTime = i / sampleRate;
                if (rms > 0.025 && (currentTime - lastPeakTime) > minInterval) {
                    times.push(currentTime);
                    lastPeakTime = currentTime;
                }
            }
            return times.map(time => ({
                spawnTime: time - scrollDuration, 
                targetTime: time,
                col: Math.floor(Math.random() * 4),
                hit: false,
                missed: false
            }));
        }

        function mapPitchToColumn(pitch) {
            if (pitch < 200) return 0;
            if (pitch < 400) return 1;
            if (pitch < 700) return 2;
            return 3;
        }

        function startGame() {
            score = 0;
            hp = 100;
            feedbackTimer = 0;
            currentState = "PLAYING";
            userAudio.play().catch(e=>console.log("Play prevent:",e));
            songStartTime = audioCtx.currentTime;
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function processHitRegister(trackIndex) {
            const currentAudioTime = audioCtx.currentTime - songStartTime;
            let handled = false;
            for (let t of activeTiles) {
                if (t.col === trackIndex && !t.hit && !t.missed) {
                    const timeDiff = Math.abs(currentAudioTime - t.targetTime);
                    if (timeDiff < 0.15) { 
                        t.hit = true;
                        handled = true;
                        playHitSound();
                        if (timeDiff < 0.06) {
                            score += 150;
                            feedbackText = "PERFECT!";
                            feedbackColor = "#28a745";
                        } else {
                            score += 75;
                            feedbackText = "GREAT";
                            feedbackColor = "#3278f0";
                        }
                        feedbackTimer = 30;
                        break;
                    }
                }
            }
            if (!handled) {
                hp -= 5;
                feedbackText = "MISS";
                feedbackColor = "#dc3545";
                feedbackTimer = 30;
            }
        }

        window.addEventListener("keydown", (e) => {
            if (currentState !== "PLAYING" || selectedDevice !== "PC") return;
            const idx = TRACK_KEYS.indexOf(e.key.toLowerCase());
            if (idx !== -1) processHitRegister(idx);
        });

        canvas.addEventListener("touchstart", (e) => {
            if (currentState !== "PLAYING" || selectedDevice !== "MOBILE") return;
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const relativeX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
                const trackIdx = Math.floor(relativeX / COLUMN_WIDTH);
                if (trackIdx >= 0 && trackIdx < 4) processHitRegister(trackIdx);
            }
        }, { passive: false });

        function update() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, 400, 600);
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 2;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(i * COLUMN_WIDTH, 0);
                ctx.lineTo(i * COLUMN_WIDTH, 600);
                ctx.stroke();
            }
            ctx.strokeStyle = "rgba(50, 120, 240, 0.8)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, HIT_LINE_Y);
            ctx.lineTo(400, HIT_LINE_Y);
            ctx.stroke();

            if (currentState === "MENU") {
                ctx.fillStyle = "#aaaaaa";
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                if (!selectedDevice) {
                    ctx.fillText("Select your platform to play", 200, 250);
                } else {
                    const controlHint = selectedDevice === "PC" ? "Controls: D  F  J  K" : "Controls: Tap Lanes";
                    ctx.fillText(controlHint, 200, 360);
                    ctx.fillStyle = "#ffc107";
                    ctx.fillText(`Difficulty: ${selectedDifficulty}`, 200, 390);
                    ctx.fillStyle = "#aaaaaa";
                    ctx.fillText("Auto fallback beat mode if pitch fails", 200, 430);
                }
            }

            if (currentState === "PLAYING") {
                const currentAudioTime = audioCtx.currentTime - songStartTime;
                const tileColors = ["#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1"];
                for (let t of activeTiles) {
                    if (currentAudioTime >= t.spawnTime) {
                        const progress = (currentAudioTime - t.spawnTime) / scrollDuration;
                        const currentY = progress * HIT_LINE_Y - TILE_HEIGHT;
                        if (currentAudioTime > t.targetTime + 0.15 && !t.hit && !t.missed) {
                            t.missed = true;
                            hp -= 8;
                            feedbackText = "MISS";
                            feedbackColor = "#dc3545";
                            feedbackTimer = 30;
                        }
                        if (!t.hit && currentY < 600) {
                            ctx.fillStyle = t.missed ? "#442222" : tileColors[t.col];
                            ctx.fillRect(t.col * COLUMN_WIDTH + 4, currentY, COLUMN_WIDTH - 8, TILE_HEIGHT);
                        }
                    }
                }
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(0, 0, 400, 50);
                ctx.fillStyle = hp < 30 ? "#dc3545" : "#28a745";
                ctx.fillRect(20, 18, Math.max(0, hp) * 1.5, 14);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "left";
                ctx.fillText("SCORE: " + score, 200, 30);
                if (feedbackTimer > 0) {
                    ctx.fillStyle = feedbackColor;
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, 200, 300);
                    feedbackTimer--;
                }
                if (hp <= 0 || (userAudio && userAudio.ended)) {
                    currentState = "MENU";
                    userAudio.pause();
                    pcBtn.style.display = "block";
                    mobileBtn.style.display = "block";
                    selectedDevice = null;
                }
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
